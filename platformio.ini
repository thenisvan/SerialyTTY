; ===================================================================
; IMPORTANT: ESP32-C6 Arduino Support on macOS ARM64
; ===================================================================
; PlatformIO currently lacks precompiled Arduino framework packages
; for ESP32-C6 on macOS ARM64 (Apple Silicon).
;
; WORKAROUNDS:
; 1. Use esp32dev environment below for local development/testing
; 2. Build for ESP32-C6 on Linux/Windows x64, or
; 3. Use ESP-IDF framework instead of Arduino (requires code changes)
; 4. Use Docker with x64 emulation: 
;    docker run --platform linux/amd64 -v $(pwd):/project -w /project \
;      infinitecoding/platformio-core pio run -e esp32c6
;
; For production ESP32-C6 deployment, use CI/CD on x64 or native Linux.
; ===================================================================

; ESP32-C6 environment (ESP-IDF framework)
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = 
    -DCONFIG_LOG_DEFAULT_LEVEL_DEBUG=1
upload_speed = 921600
extra_scripts = extra_script.py

; ESP32 fallback environment (for testing on standard ESP32 if C6 build fails)
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -DCORE_DEBUG_LEVEL=3
lib_deps = 
    adafruit/Adafruit ILI9341@^1.6.1
    adafruit/Adafruit GFX Library@^1.11.9
    bodmer/TFT_eSPI@^2.5.43
upload_speed = 921600

