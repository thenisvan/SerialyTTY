name: Deploy Documentation

on:
  push:
    branches:
    - main
    paths:
    - 'content/docs/**'
    - 'publishing/docusaurus/**'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        cache-dependency-path: publishing/docusaurus/package-lock.json

    - name: Install dependencies
      working-directory: publishing/docusaurus
      run: npm ci

    - name: Sync content
      run: |
        rsync -av --delete content/docs/ publishing/docusaurus/docs/
        cp content/sidebars-serialytty.ts publishing/docusaurus/sidebars-serialytty.ts

    - name: Build documentation
      working-directory: publishing/docusaurus
      run: npm run build
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        SITE_URL: https://${{ github.repository_owner }}.github.io
        BASE_URL: /${{ github.event.repository.name }}/

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: publishing/docusaurus/build

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
