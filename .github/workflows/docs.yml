name: Deploy Documentation

on:
  push:
    branches:
    - docs
    paths:
    - 'content/docs/**'
    - 'publishing/docusaurus/**'
    - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: publishing/docusaurus/package-lock.json

    - name: Install dependencies
      working-directory: publishing/docusaurus
      run: npm ci

    - name: Sync content
      run: |
        rsync -av --delete content/docs/ publishing/docusaurus/docs/
        cp content/sidebars-serialytty.ts publishing/docusaurus/sidebars-serialytty.ts

    - name: Build documentation
      working-directory: publishing/docusaurus
      run: npm run build
      env:
        RELEASE_TAG: ${{ github.ref_name }}
        COMMIT_SHA: ${{ github.sha }}
        BUILD_DATE: ${{ github.event.head_commit.timestamp }}
        GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        SITE_URL: https://${{ github.repository_owner }}.github.io
        BASE_URL: /${{ github.event.repository.name }}/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./publishing/docusaurus/build
        publish_branch: gh-pages
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: 'Deploy documentation from docs branch'
